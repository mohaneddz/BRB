org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# The project lives on a different drive (D:) than the Gradle/pub caches
# (C:\Users\...), and the Kotlin incremental compiler's relative-path
# resolution throws "this and base files have different roots" trying to
# relativize across drive letters on Windows. Incremental compilation isn't
# needed for local dev builds anyway.
kotlin.incremental=false
